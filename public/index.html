<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Video Downloader</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/styles.css" rel="stylesheet">
</head>
<body>
    <div class="container py-5">
        <h1 class="text-center mb-4">YouTube Video Downloader</h1>
        
        <div class="card shadow-sm">
            <div class="card-body">
                <div class="mb-3">
                    <label for="urlInput" class="form-label">YouTube URLs</label>
                    <div id="urlInputs">
                        <div class="input-group mb-2">
                            <input type="url" class="form-control url-input" placeholder="https://www.youtube.com/watch?v=..." required>
                            <button class="btn btn-outline-danger remove-url" type="button" disabled>Remove</button>
                        </div>
                    </div>
                    <button id="addUrlBtn" class="btn btn-outline-secondary btn-sm">Add Another URL</button>
                </div>
                
                <div class="mb-3">
                    <label for="formatSelect" class="form-label">Format</label>
                    <select id="formatSelect" class="form-select">
                        <option value="best">Best video + audio</option>
                        <option value="video">Best video only</option>
                        <option value="audio">Best audio only</option>
                        <option value="mp4">MP4 (video + audio)</option>
                        <option value="webm">WebM (video + audio)</option>
                        <option value="mp3">MP3 (audio)</option>
                    </select>
                </div>
                
                <button id="downloadBtn" class="btn btn-primary w-100">Download Videos</button>
            </div>
        </div>
        
        <div id="statusArea" class="mt-4" style="display: none;">
            <h3>Download Status</h3>
            <div id="jobInfo" class="mb-3"></div>
            <div id="downloadItems"></div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/app.js"></script>
</body>
</html>
